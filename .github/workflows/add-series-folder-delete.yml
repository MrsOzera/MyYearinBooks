name: Add series folder delete control

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, '[series-delete-added]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add delete button and handler
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''        <button type="button" class="series-folder-open" onclick="openSeriesFolder('${folder.id}')">Open</button>'''
          new='''        <div class="series-note-actions">
          <button type="button" class="series-folder-open" onclick="openSeriesFolder('${folder.id}')">Open</button>
          <button type="button" class="icon-btn" title="Delete series" aria-label="Delete ${esc(folder.name)}" onclick="deleteSeriesFolder('${folder.id}')">×</button>
        </div>'''
          if old in s and 'onclick="deleteSeriesFolder(' not in s:
              s=s.replace(old,new,1)

          marker='''window.openSeriesFolder=function(id){
  activeSeriesFolderId=id;
  renderActiveSeriesFolder();
}
'''
          handler='''window.deleteSeriesFolder=function(id){
  const folder=seriesFolders.find(f=>f.id===id);
  if(!folder)return;
  const noteCount=(folder.entries||[]).length;
  const noteWarning=noteCount ? ` This will also delete ${noteCount} saved note${noteCount===1?"":"s"}.` : "";
  if(!confirm(`Delete “${folder.name}”?${noteWarning}`))return;

  seriesFolders=seriesFolders.filter(f=>f.id!==id);
  if(activeSeriesFolderId===id){
    activeSeriesFolderId=null;
    editingSeriesEntryId=null;
    $("seriesEntryForm").classList.add("hidden-field");
  }
  persistSeriesFolders();
  renderSeriesFolders();
}

'''
          if marker in s and 'window.deleteSeriesFolder=function' not in s:
              s=s.replace(marker,handler+marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add series folder delete control [series-delete-added]"
          git push
