name: Enable Cloudflare sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    if: ${{ !contains(github.event.head_commit.message, '[cloud-sync-enabled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cloud sync client
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          tag='<script src="cloud-sync.js"></script>'
          if tag not in html:
              html=html.replace('</body>', tag+'\n</body>', 1)
              p.write_text(html,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable cloud sync client [cloud-sync-enabled]"
            git push
          fi
