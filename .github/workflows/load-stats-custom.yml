name: Load stats visual refinements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    if: ${{ !contains(github.event.head_commit.message, '[stats-visuals-enabled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stats custom script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="stats-custom.js"></script>'
          if tag not in s:
              s=s.replace('<script src="cloud-sync.js"></script>', tag+'\n<script src="cloud-sync.js"></script>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable stats visual refinements [stats-visuals-enabled]"
            git push
          fi
