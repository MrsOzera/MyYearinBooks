name: Consolidate stats customizations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fold stats customizations into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'const chartColors=["#d98295","#f4b8c4","#a95c78","#fadadd","#c7a34a","#111111","#e8a6b3","#7f4450"];',
              'const chartColors=["#F4B8C4","#F6DEA8","#BFD7EA","#BFD8C0","#D7C5E8","#F5C6A5","#FADADD","#BFE3DF"];',
              1
          )

          helper = base64.b64decode('').decode()
          if 'function monthlyLineChartSvg(' not in s:
              s = s.replace('function buildMonthlyData(yearBooks){', helper + 'function buildMonthlyData(yearBooks){', 1)

          s = s.replace(
              'monthlyBooksChart.innerHTML=barChartSvg(monthly.map(m=>m.books),shortLabels,v=>Math.round(v).toString());',
              'monthlyBooksChart.innerHTML=monthlyLineChartSvg(monthly.map(m=>m.books),shortLabels,{integer:true,format:v=>String(Math.round(v))});',
              1
          )
          s = s.replace(
              'monthlyPagesChart.innerHTML=barChartSvg(monthly.map(m=>m.pages),shortLabels,v=>Math.round(v).toLocaleString());',
              'monthlyPagesChart.innerHTML=monthlyLineChartSvg(monthly.map(m=>m.pages),shortLabels,{integer:true,format:v=>Math.round(v).toLocaleString()});',
              1
          )

          title_css = '\n/* Keep wrapped pie-chart titles visually together. */\n.pie-card .visual-title{\n  line-height:.82;\n  margin-bottom:10px;\n}\n'
          if '/* Keep wrapped pie-chart titles visually together. */' not in s:
              s = s.replace('</style>', title_css + '\n</style>', 1)

          s = s.replace('<script src="stats-custom.js"></script>\n', '')
          s = s.replace('<script src="stats-custom.js"></script>', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit consolidated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fold stats customizations into index [stats-consolidated]"
            git push
          fi
