name: Stop automatic genre filling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop book search from filling genre fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''  // Try to suggest genre/subgenres from Open Library subjects.\n  let subjects=Array.isArray(d.subjects)?d.subjects:[];\n  if(subjects.length<3 && d.workKey){\n    const workSubjects=await fetchWorkSubjects(d.workKey);\n    subjects=[...new Set([...subjects,...workSubjects])];\n  }\n  const inferred=inferGenreAndSubgenres(subjects);\n  if(inferred.genre && !$("genre").value.trim()) $("genre").value=inferred.genre;\n  if(inferred.subgenres.length && !$("subgenre").value.trim()) {\n    $("subgenre").value=inferred.subgenres.join(", ");\n  }\n\n'''
          if old not in s:
              raise SystemExit('Automatic genre-fill block not found')
          s=s.replace(old,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Stop search from auto-filling genres"
          git push
